{{ define "main" }}
<div class="main-title">
  <h1 class="main-title__primary">{{ .Title }}</h1>
</div>
<article class="hentry">
  {{- with .Params.thumbnail }}
  <img class="hentry__thumbnail" src="{{ . }}" alt="{{ $.Title }}">
  {{- end }}
  {{- if .Date }}
  <div class="meta-data">
    <time class="meta-data__date">{{ .Date.Format "2 January 2006" }}</time>
  </div>
  {{- end }}
  <div class="hentry__content">
    {{ .Content }}
  </div>
</article>
{{ end }}
