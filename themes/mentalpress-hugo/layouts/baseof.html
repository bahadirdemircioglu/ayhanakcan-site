<!DOCTYPE html>
<html lang="tr-TR">
<head>
  {{ partial "head.html" . }}
</head>
<body class="custom-background{{ block "bodyClass" . }}{{ end }}">

  {{- partial "top-bar.html" . }}

  <div class="container">
    <header class="header">
      {{- partial "header.html" . }}
    </header>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-xs-12 col-md-9 col-md-push-3" role="main">
        <div class="content-container">
          {{- block "main" . }}{{ end }}
        </div>
        {{- partial "latest-posts.html" . }}
      </div>
      <div class="col-xs-12 col-md-3 col-md-pull-9">
        <div class="sidebar">
          {{- partial "nav.html" . }}
        </div>
      </div>
    </div>
  </div>

  <div class="footer-gradient"></div>
  {{- partial "footer.html" . }}

  <script src="/js/main.js"></script>
</body>
</html>
