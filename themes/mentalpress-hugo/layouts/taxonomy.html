{{ define "main" }}
<div class="main-title">
  <h1 class="main-title__primary">{{ .Title }}</h1>
</div>
<article class="hentry">
  {{ .Content }}
  <div class="section-posts">
    {{ range .Pages }}
    <div class="section-post-item">
      <h3 class="section-post__title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
      {{- with .Summary }}
      <p class="section-post__excerpt">{{ . | plainify | truncate 120 }}</p>
      {{- end }}
      <a class="read-more" href="{{ .RelPermalink }}">Devamını oku</a>
    </div>
    {{ end }}
  </div>
</article>
{{ end }}
